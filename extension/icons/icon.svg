<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 禅道助手：圆角方块底 + 禅圆（ensō，留一道缺口）+ 对勾；缺口处一点金色像落笔 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#shine)"/>
  <!-- 禅圆：从右上方起笔，逆时针绕一圈，在起笔处留缺口；收笔略细 -->
  <path d="M86.6 34.6 A36 36 0 1 0 98.9 56.4" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <path d="M98.9 56.4 A36 36 0 0 0 95.2 46" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".9"/>
  <!-- 对勾 -->
  <path d="M46 65 L58.5 77.5 L83 51" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 落笔点 -->
  <circle cx="91.5" cy="30.5" r="6" fill="#FBBF24"/>
</svg>
